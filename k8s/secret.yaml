apiVersion: v1
kind: Secret
metadata:
  name: terraform-registry-secret
  namespace: terraform-registry
  labels:
    app.kubernetes.io/name: terraform-registry
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # DO NOT commit a real key here. This manifest ships with no value on purpose,
  # so `kubectl apply` fails loudly rather than deploying a public signing key
  # (a committed key can be used to forge admin tokens). Create the secret out of
  # band instead, for example:
  #
  #   kubectl create secret generic terraform-registry-secret \
  #     --namespace terraform-registry \
  #     --from-literal=AUTH_SECRETKEY="$(openssl rand -base64 32)" \
  #     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 24)"
  #
  # If you must template it, inject the values from your secret manager at apply
  # time; never store them in git.
  AUTH_SECRETKEY: ""  # REQUIRED: set to a strong random value out of band
  ADMIN_PASSWORD: ""  # REQUIRED on first boot with auth enabled: initial admin password
---
# TLS Secret for HTTPS (optional, create from your certificates)
# kubectl create secret tls terraform-registry-tls \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key \
#   -n terraform-registry
