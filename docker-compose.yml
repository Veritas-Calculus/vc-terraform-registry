services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: vc-registry-backend
    # Bound to localhost only: the frontend reaches the backend over the internal
    # Docker network (http://backend:8080), so the API must not be published in
    # cleartext on all host interfaces. Use 127.0.0.1 for direct API/health access.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - SERVER_MODE=release
      - DATABASE_URL=sqlite:/data/registry.db
      - STORAGE_PATH=/data/registry
      - AUTH_ENABLED=true
      # Supplied from .env; compose aborts if unset. Generate: openssl rand -base64 32
      - AUTH_SECRETKEY=${AUTH_SECRETKEY:?set AUTH_SECRETKEY in .env (openssl rand -base64 32)}
      # Initial admin password. If omitted, the backend generates a random one
      # and prints it once at first boot; set it here to choose your own.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - LOG_LEVEL=info
    volumes:
      - registry-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - registry-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://localhost:3443
        - VITE_REGISTRY_HOST=${REGISTRY_HOST:-localhost:3443}
    container_name: vc-registry-frontend
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
      - ./frontend/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - registry-network

volumes:
  registry-data:

networks:
  registry-network:
    driver: bridge
